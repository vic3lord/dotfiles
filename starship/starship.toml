"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$localip\
$shlvl\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$package\
$buf\
$memory_usage\
$direnv\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$time\
$status\
$os\
$container\
$shell\
$character"""

# Cloud context sits on the right of the input line so the left prompt stays short.
right_format = "$kubernetes$gcloud$aws"

[kubernetes]
disabled = false
format = '[⎈ $context( \($namespace\))]($style) '
style = "cyan"

# First matching rule wins. Prod rules come first: bold red + shortened name.
[[kubernetes.contexts]]
context_pattern = "gke_.*_(?P<cluster>[\\w-]*prod[\\w-]*)"
context_alias = "$cluster"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[\\w-]+:\\d+:cluster/(?P<cluster>[\\w-]*prod[\\w-]*)"
context_alias = "$cluster"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"

# Shorten long cluster names: gke_<project>_<zone>_<name> and EKS ARNs -> <name>
[[kubernetes.contexts]]
context_pattern = "gke_.*_(?P<cluster>[\\w-]+)"
context_alias = "$cluster"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[\\w-]+:\\d+:cluster/(?P<cluster>[\\w-]+)"
context_alias = "$cluster"

[gcloud]
format = '[☁ $project]($style) '
style = "blue"

[aws]
# $duration = time left on temporary creds; shows expiration_symbol once expired
format = '[aws(:$profile)( \[$duration\]) ]($style)'
style = "yellow"
expiration_symbol = "EXPIRED"
